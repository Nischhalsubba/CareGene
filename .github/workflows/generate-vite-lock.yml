name: Refresh Vite 8 lockfile

on:
  push:
    branches:
      - chore/vite-8-20260908

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out upgrade branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Refresh lockfile without lifecycle scripts
        working-directory: app
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit refreshed lockfile
        run: |
          git add app/package-lock.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Lockfile already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh lockfile for Vite 8'
          git push origin HEAD:${GITHUB_REF_NAME}
