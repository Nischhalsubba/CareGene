name: Apply reviewed browser dependency pin

on:
  push:
    branches:
      - remediate/github-supply-chain-20260908

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Apply exact reviewed replacements
        shell: python
        run: |
          from pathlib import Path

          html = Path('app/index.html')
          source = html.read_text()
          old = 'https://unpkg.com/lucide@latest'
          new = 'https://unpkg.com/lucide@1.42.0'
          if source.count(old) != 1:
              raise SystemExit(f'Expected exactly one mutable Lucide URL, found {source.count(old)}')
          html.write_text(source.replace(old, new))

          readme = Path('README.md')
          text = readme.read_text()
          old_install = 'cd app\nnpm install\nnpm run dev'
          new_install = 'cd app\nnpm ci\nnpm run dev'
          if text.count(old_install) != 1:
              raise SystemExit(f'Expected exactly one developer install block, found {text.count(old_install)}')
          readme.write_text(text.replace(old_install, new_install))

      - name: Commit reviewed replacements
        run: |
          git add app/index.html README.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'security: pin browser dependency and document npm ci'
          git push origin HEAD:${GITHUB_REF_NAME}
